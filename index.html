  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #000000; --ink: #ffffff; --soft: #a3a3a3; --err: #ff6a5f;
      --logo-filter: invert(1); --glitch-blend: screen;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.5;
    display: flex;
    justify-content: center;
    padding: clamp(1.5rem, 5vw, 3rem) 1.25rem 2rem;
  }
  main { width: 100%; max-width: 28rem; text-align: center; }

  /* Logo (image embedded in the page, no external file needed) */
  .logo { display: block; width: min(70%, 15rem); margin: 0 auto clamp(1.75rem, 5vw, 2.5rem); color: inherit; }
  .glitch { position: relative; display: block; aspect-ratio: 720 / 399; }
  .glitch > *, .glitch::before, .glitch::after {
    content: ""; position: absolute; inset: 0;
    -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat;
  }
  .glitch .base { background: var(--ink); z-index: 2; }
  .glitch::before { background: #ff1f4b; z-index: 1; mix-blend-mode: var(--glitch-blend); opacity: 0; }
  .glitch::after  { background: #00d9ff; z-index: 1; mix-blend-mode: var(--glitch-blend); opacity: 0; }
  .glitch .slice  { background: var(--ink); z-index: 3; opacity: 0; }

  @media (prefers-reduced-motion: no-preference) {
    .glitch .base, .glitch::before, .glitch::after, .glitch .slice {
      animation: 7s steps(1) -5.6s infinite;
    }
    .glitch .base   { animation-name: g-main; }
    .glitch::before { animation-name: g-red; }
    .glitch::after  { animation-name: g-cyan; }
    .glitch .slice  { animation-name: g-slice; }
    .logo:hover .glitch > *, .logo:hover .glitch::before, .logo:hover .glitch::after,
    .logo:focus-visible .glitch > *, .logo:focus-visible .glitch::before, .logo:focus-visible .glitch::after {
      animation-duration: 1.6s; animation-delay: -1.4s;
    }
  }
  /* Short burst between 90% and 95% of the cycle, logo steady the rest of the time */
  @keyframes g-main {
    0%, 89%, 95%, 100% { transform: none; }
    90% { transform: translateX(-2px); }
    92% { transform: translateX(2px) skewX(3deg); }
    94% { transform: translateX(-1px); }
  }
  @keyframes g-red {
    0%, 89%, 95%, 100% { opacity: 0; transform: none; clip-path: none; }
    90% { opacity: .9; transform: translate(-3px, 0); clip-path: inset(10% 0 50% 0); }
    92% { opacity: .9; transform: translate(3px, 1px); clip-path: inset(45% 0 20% 0); }
    94% { opacity: .7; transform: translate(-2px, 0); clip-path: none; }
  }
  @keyframes g-cyan {
    0%, 89%, 95%, 100% { opacity: 0; transform: none; clip-path: none; }
    90% { opacity: .9; transform: translate(3px, 0); clip-path: inset(55% 0 10% 0); }
    92% { opacity: .9; transform: translate(-3px, -1px); clip-path: inset(5% 0 60% 0); }
    94% { opacity: .7; transform: translate(2px, 0); clip-path: none; }
  }
  @keyframes g-slice {
    0%, 90%, 94%, 100% { opacity: 0; transform: none; }
    91% { opacity: 1; transform: translateX(-8px); clip-path: inset(38% 0 56% 0); }
    93% { opacity: 1; transform: translateX(6px); clip-path: inset(70% 0 25% 0); }
  }

  .cover { display: block; width: min(60%, 15rem); height: auto; aspect-ratio: 1; object-fit: cover; margin: 0 auto 1.5rem; }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-style: italic;
    font-size: clamp(2.25rem, 9vw, 3.25rem);
    line-height: 1;
    margin: 0 0 .35rem;
  }
  .artist { font-family: var(--serif); font-size: 1.125rem; margin: 0 0 1.25rem; }
  .intro { color: var(--soft); margin: 0 auto 2rem; max-width: 25rem; }

  form { text-align: left; }
  label { display: block; font-size: .9375rem; margin-bottom: .4rem; }
  input {
    display: block; width: 100%;
    font: inherit; font-size: 1.125rem;
    padding: .8rem .9rem;
    border: 1px solid var(--ink); border-radius: 0;
    background: var(--paper); color: var(--ink);
    margin-bottom: .75rem;
  }
  button, .btn {
    display: block; width: 100%;
    font: inherit; font-weight: 600;
    padding: .9rem 1rem;
    border: 1px solid var(--ink); border-radius: 999px;
    background: var(--ink); color: var(--paper);
    cursor: pointer; text-decoration: none; text-align: center;
  }
  button.ghost { background: transparent; color: var(--ink); }
  button:disabled { opacity: .5; cursor: wait; }
  input:focus-visible, button:focus-visible, .btn:focus-visible, a:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 3px;
  }
  .msg { min-height: 1.5em; margin: .75rem 0 0; font-size: .9375rem; }
  .msg.err { color: var(--err); }

  .ticket[hidden], form[hidden], .intro[hidden] { display: none; }
  .hello { font-family: var(--serif); font-style: italic; font-size: 1.375rem; margin: 0 0 1rem; }
  .code {
    font-family: var(--serif); font-weight: 600;
    font-size: clamp(2.25rem, 11vw, 3.25rem);
    letter-spacing: .06em; line-height: 1.1;
    padding: 1.5rem .5rem;
    border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    margin: 0 0 1.5rem;
    user-select: all; word-break: break-all;
  }
  @media (prefers-reduced-motion: no-preference) {
    .ticket:not([hidden]) .code { animation: ink .6s ease-out both; }
    @keyframes ink { from { opacity: 0; filter: blur(6px); letter-spacing: .3em; } to { opacity: 1; filter: none; letter-spacing: .06em; } }
  }
  .actions { display: grid; gap: .5rem; margin-bottom: 1.25rem; }
  .how { color: var(--soft); font-size: .9375rem; margin: 0; }
  .stock { color: var(--soft); font-size: .875rem; margin-top: 2.5rem; }
</style>

  <h1>Paradise Lost</h1>
  <p class="artist">Salma Rosa &amp; Jonnnah</p>
  <p class="intro" id="intro">Enter your name to get your own free download code. Use the same name again and you'll get the same code back.</p>

  <form id="form" novalidate>
    <label for="name">Name</label>
    <input id="name" name="name" autocomplete="nickname" maxlength="60" required>
    <button id="go" type="submit">Get my code</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <section class="ticket" id="ticket" hidden aria-live="polite">
    <p class="hello" id="hello"></p>
    <div class="code" id="code"></div>
    <div class="actions">
      <a class="btn" id="redeem" href="#" target="_blank" rel="noopener">Copy and open Bandcamp</a>
      <button class="ghost" id="copy" type="button">Copy code</button>
    </div>
    <p class="how">On Bandcamp, paste the code, confirm, then download.</p>
    <p class="msg" id="copied" role="status"></p>
  </section>

  <p class="stock" id="stock"></p>
</main>

<script>
  // Settings
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzblrfqJdRcyDrS3w9Dcf9eeEslSx5RiuUbP9FcS5tZw1Qp90N1K5hsCn3s0YFoX73x/exec";
  const REDEEM_URL = "https://comicsansrecords.bandcamp.com/yum";
  const STORE_KEY = "csr-code-paradise-lost";

  const $ = id => document.getElementById(id);
  const form = $("form"), ticket = $("ticket"), msg = $("msg");
  $("redeem").href = REDEEM_URL;

  const errors = {
    name: "Your name needs at least 2 characters.",
    empty: "All codes have been claimed.",
    server: "The server returned an error. Try again in a moment.",
    network: "Can't reach the server. Check your connection and try again."
  };

  function show(code, name, again) {
    $("code").textContent = code;
    $("hello").textContent = again ? `Welcome back, ${name}. Your code:` : `${name}, here's your code:`;
    $("intro").hidden = true;
    form.hidden = true;
    ticket.hidden = false;
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ code, name })); } catch (e) {}
  }

  async function copyCode() {
    try {
      await navigator.clipboard.writeText($("code").textContent);
      $("copied").textContent = "Code copied.";
    } catch (e) {
      $("copied").textContent = "Couldn't copy automatically: select the code to copy it.";
    }
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("name").value.trim();
    if (name.length < 2) { msg.className = "msg err"; msg.textContent = errors.name; return; }
    $("go").disabled = true;
    msg.className = "msg"; msg.textContent = "Getting your code…";
    try {
      const r = await fetch(`${SCRIPT_URL}?action=claim&name=${encodeURIComponent(name)}`);
      const data = await r.json();
      if (data.ok) { msg.textContent = ""; show(data.code, name, data.again); loadStock(); }
      else { msg.className = "msg err"; msg.textContent = errors[data.error] || errors.server; }
    } catch (err) {
      msg.className = "msg err"; msg.textContent = errors.network;
    } finally {
      $("go").disabled = false;
    }
  });

  $("copy").addEventListener("click", copyCode);
  $("redeem").addEventListener("click", copyCode);

  async function loadStock() {
    try {
      const d = await (await fetch(`${SCRIPT_URL}?action=stock`)).json();
      if (d.ok && d.total) $("stock").textContent = `${d.left} of ${d.total} code${d.total > 1 ? "s" : ""} left`;
    } catch (e) {}
  }

  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && saved.code) show(saved.code, saved.name, true);
  } catch (e) {}
  loadStock();
</script>
